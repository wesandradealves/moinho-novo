name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Run verification
        env:
          OXYGEN_LICENSE_KEY: ${{ secrets.OXYGEN_LICENSE_KEY }}
        run: |
          ./scripts/verify.sh
