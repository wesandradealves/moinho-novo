services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${WORDPRESS_DB_NAME:-wordpress}
      MARIADB_USER: ${WORDPRESS_DB_USER:-wordpress}
      MARIADB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -u root -p$${MARIADB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  wordpress:
    build:
      context: .
      args:
        WORDPRESS_DOWNLOAD_URL: ${WORDPRESS_DOWNLOAD_URL:-https://wordpress.org/latest.tar.gz}
        OXYGEN_ZIP_URL: ${OXYGEN_ZIP_URL:-}
        OXYGEN_ZIP_SHA256: ${OXYGEN_ZIP_SHA256:-}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${WORDPRESS_PORT:-8080}:80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_NAME: ${WORDPRESS_DB_NAME:-wordpress}
      WORDPRESS_DB_USER: ${WORDPRESS_DB_USER:-wordpress}
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-wordpress}
      WORDPRESS_TABLE_PREFIX: ${WORDPRESS_TABLE_PREFIX:-wp_}
      WORDPRESS_DEBUG: ${WORDPRESS_DEBUG:-0}
      WORDPRESS_DB_DUMP: ${WORDPRESS_DB_DUMP:-/opt/seed/db.sql}
      WORDPRESS_REDIS_HOST: ${WORDPRESS_REDIS_HOST:-redis}
      WORDPRESS_REDIS_PORT: ${WORDPRESS_REDIS_PORT:-6379}
      WORDPRESS_REDIS_DATABASE: ${WORDPRESS_REDIS_DATABASE:-0}
      WORDPRESS_REDIS_PREFIX: ${WORDPRESS_REDIS_PREFIX:-moinho_novo}
      REDIS_CACHE_AUTO_DOWNLOAD: ${REDIS_CACHE_AUTO_DOWNLOAD:-1}
      REDIS_CACHE_DOWNLOAD_URL: ${REDIS_CACHE_DOWNLOAD_URL:-https://downloads.wordpress.org/plugin/redis-cache.latest-stable.zip}
      REDIS_CACHE_ZIP_PATH: ${REDIS_CACHE_ZIP_PATH:-}
      REDIS_CACHE_ZIP_URL: ${REDIS_CACHE_ZIP_URL:-}
      REDIS_CACHE_ZIP_SHA256: ${REDIS_CACHE_ZIP_SHA256:-}
      AIOWPM_ZIP_PATH: /opt/plugins/all-in-one-wp-migration-unlimited-main.zip
      AIOWPM_ZIP_URL: ${AIOWPM_ZIP_URL:-}
      AIOWPM_ZIP_SHA256: ${AIOWPM_ZIP_SHA256:-}
      AIOWPM_PLUGIN_FILE: ${AIOWPM_PLUGIN_FILE:-all-in-one-wp-migration-unlimited-main/all-in-one-wp-migration.php}
      WP_OPTIMIZE_ZIP_PATH: /opt/plugins/wp-optimize.zip
      WP_OPTIMIZE_ZIP_URL: ${WP_OPTIMIZE_ZIP_URL:-}
      WP_OPTIMIZE_ZIP_SHA256: ${WP_OPTIMIZE_ZIP_SHA256:-}
      WP_OPTIMIZE_PLUGIN_FILE: ${WP_OPTIMIZE_PLUGIN_FILE:-wp-optimize/wp-optimize.php}
      OXYGEN_LICENSE_KEY: ${OXYGEN_LICENSE_KEY:-}
      OXYGEN_ZIP_PATH: /opt/oxygen/oxygen.zip
      OXYGEN_ZIP_URL: ${OXYGEN_ZIP_URL:-}
      OXYGEN_ZIP_SHA256: ${OXYGEN_ZIP_SHA256:-}
      CONTACT_FORM_7_ZIP_PATH: /opt/plugins/contact-form-7.zip
      CONTACT_FORM_7_ZIP_URL: ${CONTACT_FORM_7_ZIP_URL:-}
      CONTACT_FORM_7_ZIP_SHA256: ${CONTACT_FORM_7_ZIP_SHA256:-}
    volumes:
      - wp-data:/var/www/html
      - ./uploads:/var/www/html/wp-content/uploads
      - ./themes/moinho-novo:/var/www/html/wp-content/themes/moinho-novo
      - ./mu-plugins:/var/www/html/wp-content/mu-plugins
      - ./db.sql:/opt/seed/db.sql:ro
      - ./oxygen-4.9.5.zip:/opt/oxygen/oxygen.zip:ro
      - ./contact-form-7.6.1.4.zip:/opt/plugins/contact-form-7.zip:ro
      - ./all-in-one-wp-migration-unlimited-main.zip:/opt/plugins/all-in-one-wp-migration-unlimited-main.zip:ro
      - ./wp-optimize.4.4.1.zip:/opt/plugins/wp-optimize.zip:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/wp-login.php >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  db-data:
  wp-data:
  redis-data:
